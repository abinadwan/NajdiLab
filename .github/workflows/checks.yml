name: Source checks
# Heavy cross-platform runs are not started for every push to a draft PR. They run when a
# PR is opened or marked ready for review, on every push to a ready PR, on main, and on
# demand (Actions > Source checks > Run workflow) to verify a specific draft HEAD.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/install.py --check
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install -r requirements-chat.txt
      - run: python -m compileall -q app scripts tests
      - run: python scripts/check_docs.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/integrations-ui.test.cjs tests/chat-ui.test.cjs tests/chat-v2-ui.test.cjs tests/phase39-ui.test.cjs tests/dataset-identity-ui.test.cjs tests/pagination-ui.test.cjs tests/i18n-catalog.test.cjs
      - run: python -m pytest -q tests -rs
      - run: npm install --prefix ../chat-browser-tools --ignore-scripts --no-audit --no-fund puppeteer-core@25.16.0
      - name: Locate hosted browser for synthetic Chat acceptance
        shell: python
        run: |
          import os, shutil
          from pathlib import Path
          browser = shutil.which('google-chrome') or shutil.which('chromium')
          if not browser:
              candidate = Path(os.environ.get('PROGRAMFILES', '')) / 'Google/Chrome/Application/chrome.exe'
              if candidate.is_file(): browser = str(candidate)
          if not browser: raise SystemExit('Hosted browser required for Chat acceptance')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as stream:
              stream.write('NAJDILAB_BROWSER_EXECUTABLE=' + browser + '\n')
              stream.write('NODE_PATH=' + str(Path(os.environ['GITHUB_WORKSPACE']).parent / 'chat-browser-tools/node_modules') + '\n')
              stream.write('NAJDILAB_BROWSER_ARTIFACTS=browser-evidence\n')
      - run: node tests/chat-browser.cjs
        timeout-minutes: 10
      - run: node tests/chat-enhancements-browser.cjs
        timeout-minutes: 10
      - run: node --test tests/review-restrictions-browser.cjs
        timeout-minutes: 10
      - run: node --test tests/i18n-browser.cjs
        timeout-minutes: 10
      - run: node --test tests/a11y-browser.cjs
        timeout-minutes: 10
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chat-browser-${{ matrix.os }}
          path: browser-evidence
          if-no-files-found: ignore
      - if: runner.os == 'Linux'
        run: sh -n run.sh scripts/install.sh
