name: Source checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/install.py --check
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q app scripts tests
      - run: python scripts/check_docs.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/integrations-ui.test.cjs
      - run: python -m pytest -q tests -rs
      - if: runner.os == 'Linux'
        run: sh -n run.sh scripts/install.sh
