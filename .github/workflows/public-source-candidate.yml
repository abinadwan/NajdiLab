name: Source-only candidate
on:
  pull_request:
permissions:
  contents: read
jobs:
  candidate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q public_source/tests/test_builder.py
      - run: python public_source/build.py --output ../candidate
      - run: python public_source/build.py --verify ../candidate
      - run: python -m pytest -q tests -rs
        working-directory: ../candidate
      - run: python scripts/check_docs.py
